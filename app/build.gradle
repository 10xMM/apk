plugins { id 'com.android.application' }

android {
    namespace 'com.iptv.server'
    compileSdk 34
    defaultConfig {
        applicationId "com.iptv.server"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
